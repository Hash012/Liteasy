<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiteasyClaw 项目结构总览</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --line: #d7dee8;
      --blue: #2563eb;
      --green: #0f766e;
      --amber: #b45309;
      --red: #b91c1c;
      --violet: #6d28d9;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      background: #111827;
      color: #f8fafc;
      padding: 28px clamp(18px, 4vw, 48px);
      border-bottom: 4px solid #2dd4bf;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      letter-spacing: 0;
    }

    header p {
      max-width: 980px;
      margin: 0;
      color: #cbd5e1;
      font-size: 15px;
    }

    main {
      padding: 22px clamp(14px, 3vw, 36px) 40px;
      display: grid;
      gap: 18px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
      background: rgba(247, 248, 251, 0.92);
      backdrop-filter: blur(10px);
      padding: 10px 0;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 11px;
      cursor: pointer;
      font-weight: 650;
    }

    button.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
    }

    .metric, .panel, .module-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 16px;
    }

    .metric strong {
      display: block;
      font-size: 26px;
      margin-bottom: 4px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      padding: 18px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: 0;
    }

    h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .graph-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    svg {
      min-width: 1280px;
      width: 100%;
      height: 620px;
      display: block;
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .node rect {
      fill: #fff;
      stroke: #94a3b8;
      stroke-width: 1.2;
      rx: 8;
    }

    .node text {
      fill: #0f172a;
      font-size: 12px;
      font-weight: 700;
    }

    .node .sub {
      fill: #64748b;
      font-size: 10.5px;
      font-weight: 500;
    }

    .lane-title {
      fill: #334155;
      font-size: 13px;
      font-weight: 800;
    }

    .flow-label {
      fill: #475569;
      font-size: 11px;
      font-weight: 700;
    }

    .edge {
      stroke: #64748b;
      stroke-width: 1.6;
      fill: none;
      marker-end: url(#arrow);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }

    .module-card {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 9px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.foundation { background: var(--green); }
    .badge.runtime { background: var(--blue); }
    .badge.cloud { background: var(--violet); }
    .badge.product { background: var(--amber); }
    .badge.shell { background: #334155; }

    .section {
      display: grid;
      gap: 6px;
    }

    .section-title {
      color: #334155;
      font-weight: 750;
      font-size: 13px;
    }

    ul {
      margin: 0;
      padding-left: 18px;
    }

    li {
      margin: 3px 0;
    }

    code {
      background: #eef2f7;
      border: 1px solid #dde5ef;
      border-radius: 6px;
      color: #0f172a;
      display: inline-block;
      font-size: 12px;
      line-height: 1.35;
      margin: 2px 0;
      padding: 2px 5px;
      word-break: break-all;
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    summary {
      cursor: pointer;
      color: var(--blue);
      font-weight: 750;
    }

    .relation-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
    }

    .relation {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfdff;
    }

    .relation strong {
      color: #0f172a;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 780px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .tabs {
        justify-content: start;
      }
      .summary-grid {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>LiteasyClaw 项目结构总览</h1>
    <p>基于当前模块边界与源码目录生成。核心依赖方向：shell -> controllers -> feature modules -> shared types / clients。页面支持搜索、按层筛选、展开文件路径和查看建议开发方向。</p>
    <p>三人分工视图见：docs/engineering/three-person-worksplit.html</p>
  </header>

  <main>

            <text x="798" y="336">assistant</text>

    <section class="panel">

  <script>
    const modules = [
      {
        name: "shell/layout",
        layer: "shell",
        status: "已收敛为组合层",
        badge: "shell",
        implemented: [
          "三栏工作台布局、顶部账号栏、左侧导航、阅读区、右侧助手栏。",
          "组合 controller 暴露的 model/actions，承载全局 dialog 与 pane sizing。",
          "AppShell 已从 440 行降到约 410 行，领域编排已大量外移。"
        ],
        target: [
          "继续保持只负责布局和跨模块装配。",
          "不新增领域状态机，不直接组合 feature 内部 hook。"
        ],
        direction: [
          "新增页面入口时优先新增 controller，再由 AppShell 连接。",
          "保留 AppShell.test.tsx 作为 smoke/integration，不继续堆细节断言。"
        ],
        files: [
          "products/liteasy/apps/desktop/src/app/layout/AppShell.tsx",
          "products/liteasy/apps/desktop/src/app/layout/ActivityBar.tsx",
          "products/liteasy/apps/desktop/src/app/layout/LeftPane.tsx",
          "products/liteasy/apps/desktop/src/app/layout/ReaderPane.tsx",
          "products/liteasy/apps/desktop/src/app/layout/AssistantSidebar.tsx",
          "products/liteasy/apps/desktop/src/app/layout/AppDialogs.tsx",
          "products/liteasy/apps/desktop/src/app/layout/SettingsPane.tsx",
          "products/liteasy/apps/desktop/src/app/layout/PaneResizer.tsx",
          "products/liteasy/apps/desktop/src/app/layout/paneLayout.storage.ts",
          "products/liteasy/apps/desktop/src/app/layout/paneLayout.types.ts",
          "products/liteasy/apps/desktop/src/app/layout/starterPapers.ts",
          "products/liteasy/apps/desktop/src/app/layout/useAppShellStores.ts",
          "products/liteasy/apps/desktop/src/app/layout/usePaneLayout.ts",
          "products/liteasy/apps/desktop/src/app/layout/useLeftRailNavigation.ts"
        ]
      },
      {
        name: "controllers",
        layer: "controllers",
        status: "并行开发缓冲层已建立",
        badge: "foundation",
        implemented: [
          "统一暴露小 model 与小 actions，隔离 shell 与 feature 内部实现。",
          "已覆盖 workspace selection、cloud account、artifact workflow、knowledge sync、organization shell。"
        ],
        target: [
          "所有跨模块组合优先进入 controllers。",
          "让每个 feature 团队只维护自己的领域逻辑和测试。"
        ],
        direction: [
          "下一个可抽对象：model/settings/profile 的 shell-facing 组合。",
          "为每个新 controller 增加 focused hook test，避免把行为塞回 AppShell。"
        ],
        files: [
          "products/liteasy/apps/desktop/src/app/controllers/useWorkspaceSelectionController.ts",
          "products/liteasy/apps/desktop/src/app/controllers/useCloudAccountController.ts",
          "products/liteasy/apps/desktop/src/app/controllers/useArtifactWorkflowController.ts",
          "products/liteasy/apps/desktop/src/app/controllers/useKnowledgeSyncController.ts",
          "products/liteasy/apps/desktop/src/app/controllers/useOrganizationShellController.ts"
        ]
      },
      {
        name: "workspace",
        layer: "feature",
        status: "核心文献工作区可用",
        badge: "foundation",
        implemented: [
          "工作区 papers、selectedPaperIds、selectionLocked、workspaceSource、revision。",
          "文献导入队列、选中文献集导入、共享库切换、文件夹树归一化。",
          "通过 registered actions 接入 selected_set.import 与 artifact.start_analysis。"
        ],
        target: [
          "成为本地/组织/云端文献源的统一 workspace state。",
          "支持更真实的文件系统导入、拖放、多目录、多 revision 合并。"
        ],
        direction: [
          "把 workspace source 与权限能力模型补细。",
          "将导入生命周期与 ingestion 模块进一步解耦。"
        ],
        files: [
          "products/liteasy/apps/desktop/src/app/features/workspace/workspace.store.ts",
          "products/liteasy/apps/desktop/src/app/features/workspace/workspace.types.ts",
          "products/liteasy/apps/desktop/src/app/features/workspace/useWorkspaceActions.ts",
          "products/liteasy/apps/desktop/src/app/features/workspace/useRegisteredWorkspaceActions.ts",
          "products/liteasy/apps/desktop/src/app/features/workspace/workspaceFolderTree.ts",
          "products/liteasy/apps/desktop/src/app/features/workspace/workspaceStateHelpers.ts"
        ]
      },
      {
        name: "selection",
        layer: "feature",
        status: "选中文献快照已建立",
        badge: "foundation",
        implemented: [
          "SelectedDocumentSetSnapshot、ready validation、selection snapshot 构造。",
          "分析类功能可以依赖快照，而不是直接依赖 checkbox UI state。"
        ],
        target: [
          "成为所有 AI 分析、检索、artifact 生成的输入契约。",
          "支持多 selection、命名 selection、历史 selection。"
        ],
        direction: [
          "把 workspace selectedPaperIds 的读取逐步替换为 snapshot API。",
          "补充选择集变更事件，供 agent-runtime 使用。"
        ],
        files: [
          "products/liteasy/apps/desktop/src/app/features/selection/selection.types.ts",
          "products/liteasy/apps/desktop/src/app/features/selection/selectionSnapshot.ts",
          "products/liteasy/apps/desktop/src/app/features/selection/selectionValidation.ts"
        ]
      },
      {
        name: "agent-runtime",
        layer: "feature",
        status: "基础契约已落点",
        badge: "runtime",
        implemented: [
          "运行时上下文类型与 context validation。",
          "为 AI-native interaction 预留意图、事件、确认、技能执行的模块位置。"
        ],
        target: [
          "承接自由文本、按钮、快捷键、多模态输入后的统一意图路由。",
          "输出 runtime events，由 assistant UI 渲染，而不是 UI 推断隐藏行为。"
        ],
        direction: [
          "优先实现 intent -> action planning -> confirmation -> execution 的闭环。",
          "定义可审计 runtime event stream，支持可解释和可回放。"

    function moduleText(module) {

        module.name,
        module.layer,
        module.status,
        ...module.implemented,
        ...module.target,
        ...module.direction,
        ...module.files

        button.className = activeLayer === id ? "active" : "";
        button.addEventListener("click", () => {
          activeLayer = id;
          render();
        });
        tabs.appendChild(button);
      }
    }

    function renderSummary(filtered) {
      const summary = document.getElementById("summary");
      const fileCount = filtered.reduce((sum, module) => sum + module.files.length, 0);
      const controllerCount = modules.find((module) => module.name === "controllers")?.files.length ?? 0;
      summary.innerHTML = [
        ["模块", filtered.length],
        ["关联文件", fileCount],
        ["Controller", controllerCount],
        ["并行地基", "4/4"]
      ].map(([label, value]) => `
        <article class="metric">
          <strong>${value}</strong>
          <span>${label}</span>
        </article>
      `).join("");
    }

    function renderRelations() {
      const list = document.getElementById("relations");
      list.innerHTML = relations.map(([from, to, note]) => `
        <div class="relation">
          <strong>${from}</strong> -> <strong>${to}</strong>
          <div class="muted">${note}</div>
        </div>
      `).join("");
    }

    function renderCards(filtered) {
      cards.innerHTML = filtered.map((module) => `
        <article class="module-card" data-module="${module.name}">
          <div class="card-head">
            <div>
              <h3>${module.name}</h3>
              <div class="muted">${module.status}</div>
            </div>
            <span class="badge ${module.badge}">${module.layer}</span>
          </div>
          <div class="section">
            <div class="section-title">已实现功能</div>
            <ul>${module.implemented.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
          <div class="section">
            <div class="section-title">目标预期功能</div>
            <ul>${module.target.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
          <div class="section">
            <div class="section-title">建议开发方向</div>
            <ul>${module.direction.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
          <details>
            <summary>文件路径（${module.files.length}）</summary>
            <div>${module.files.map((file) => `<code>${file}</code>`).join("<br>")}</div>
          </details>
        </article>
      `).join("");
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const filtered = modules.filter((module) => {
        const layerMatch = activeLayer === "all" || module.layer === activeLayer;
        const queryMatch = q.length === 0 || moduleText(module).includes(q);
        return layerMatch && queryMatch;
      });
      renderTabs();
      renderSummary(filtered);
      renderRelations();
      renderCards(filtered);
    }

    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
