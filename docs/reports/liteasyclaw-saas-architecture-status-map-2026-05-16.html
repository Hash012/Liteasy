<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiteasyClaw SaaS 架构全景</title>
  <style>
    :root {
      --ink: #193247;
      --muted: #627789;
      --paper: #eef2ec;
      --card: rgba(255, 255, 255, 0.9);
      --line: #d4dbd1;
      --shadow: 0 18px 40px rgba(34, 51, 67, 0.08);
      --implemented: #246847;
      --implemented-soft: #e4f3ea;
      --partial: #a56a22;
      --partial-soft: #f7ead7;
      --planned: #7a4e96;
      --planned-soft: #eee1f7;
      --blue: #244966;
      --blue-soft: #e4edf4;
      --openclaw: #365f9f;
      --openclaw-soft: #dde8f8;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.92), transparent 18%),
        linear-gradient(135deg, #edf1eb 0%, #f4f1eb 50%, #eef3f6 100%);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1600px, calc(100vw - 24px));
      margin: 12px auto;
      display: grid;
      gap: 16px;
      height: calc(100vh - 38px);
      grid-template-rows: auto minmax(0, 1fr);
    }

    .hero,
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hero {
      padding: 16px 18px 14px;
      display: grid;
      gap: 10px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.08;
      letter-spacing: 0.01em;
    }

    .subtitle {
      max-width: 920px;
      color: var(--muted);
      font-size: 15px;
    }

    .hero-actions {
      display: grid;
      gap: 10px;
      justify-items: end;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .control-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip,
    .view-toggle,
    .status-filter {
      border: 1px solid #cfdbd3;
      border-radius: 999px;
      padding: 9px 13px;
      background: linear-gradient(180deg, #fff 0%, #edf3f0 100%);
      color: #2d485f;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .view-toggle.active,
    .status-filter.active {
      color: #fff;
      background: linear-gradient(180deg, #2d597d 0%, #224966 100%);
      border-color: #234a67;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-item {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 10px;
      border: 1px solid #d6ddd5;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      font-size: 12px;
    }

    .topology-strip {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 10px;
    }

    .topology-band,
    .stat-band {
      border-radius: 18px;
      border: 1px solid #d4ddda;
      background: rgba(255, 255, 255, 0.76);
      padding: 12px;
    }

    .flow-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .flow-node,
    .flow-arrow {
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
    }

    .flow-node {
      border: 1px solid #d7e4ee;
      background: #fff;
    }

    .flow-openclaw {
      color: #62428a;
      background: #efe2fb;
      border-color: #dbc6f3;
    }

    .flow-liteasy {
      color: #234966;
      background: #d8ebf7;
      border-color: #c3ddef;
    }

    .flow-saas {
      color: #2f8c6a;
      background: #d9f1e8;
      border-color: #c7e7da;
    }

    .flow-arrow {
      color: #68829a;
      background: rgba(240, 245, 249, 0.9);
    }

    .page-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .page-tab {
      border: 1px solid #d4ddd6;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #35536d;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 11px;
    }

    .page-tab.active {
      background: linear-gradient(180deg, #355d81 0%, #234966 100%);
      border-color: #234966;
      color: #fff;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-implemented { background: var(--implemented); }
    .dot-partial { background: var(--partial); }
    .dot-planned { background: var(--planned); }

    .hero-grid {
      display: none;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.9fr);
      gap: 12px;
      min-height: 0;
    }

    .panel {
      padding: 14px;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 17px;
      color: var(--blue);
    }

    .map {
      display: grid;
      gap: 8px;
      height: 100%;
      overflow: hidden;
      align-content: start;
    }

    .lane {
      border-radius: 18px;
      border: 1px solid #d9e0d6;
      background: rgba(255, 255, 255, 0.78);
      padding: 10px;
    }

    .lane-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
    }

    .lane-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-implemented {
      color: var(--implemented);
      background: var(--implemented-soft);
    }

    .status-partial {
      color: var(--partial);
      background: var(--partial-soft);
    }

    .status-planned {
      color: var(--planned);
      background: var(--planned-soft);
    }

    .node-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .node-card {
      width: auto;
      min-width: 148px;
      text-align: left;
      border: 1px solid #d6ded4;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      padding: 9px 10px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      position: relative;
    }

    .node-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(31, 45, 61, 0.08);
      border-color: #c8d4cf;
    }

    .node-card.active {
      border-color: #376084;
      box-shadow: 0 0 0 2px rgba(54, 95, 159, 0.13);
    }

    .node-card[data-status="implemented"] {
      background: linear-gradient(180deg, #ffffff 0%, #eef8f2 100%);
    }

    .node-card[data-status="partial"] {
      background: linear-gradient(180deg, #ffffff 0%, #fbf4e8 100%);
    }

    .node-card[data-status="planned"] {
      background: linear-gradient(180deg, #ffffff 0%, #f3ebfa 100%);
    }

    .node-card h4 {
      margin: 0;
      font-size: 13px;
      color: var(--ink);
    }

    .node-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .meta-chip {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 800;
      background: #edf2f6;
      color: #486174;
    }

    .detail-shell {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 12px;
      min-height: 0;
    }

    .detail-card {
      border-radius: 18px;
      border: 1px solid #d8ddd6;
      background: rgba(255, 255, 255, 0.84);
      padding: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .detail-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .detail-title-row h3 {
      margin: 0;
      font-size: 18px;
      color: var(--blue);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .detail-summary {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
    }

    .detail-section {
      margin-top: 8px;
    }

    .detail-section h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--blue);
    }

    .detail-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .detail-chip {
      border-radius: 999px;
      border: 1px solid #d7ddd6;
      background: rgba(255, 255, 255, 0.78);
      color: #486174;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 8px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #f0ece3;
      border: 1px solid #ddd4c5;
      border-radius: 6px;
      padding: 1px 6px;
      color: #3f4f61;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1040px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .hero-top {
        flex-direction: column;
      }

      .hero-actions {
        justify-items: start;
      }

      .detail-shell {
        position: static;
      }

      body {
        overflow: auto;
      }

      .page { height: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>LiteasyClaw SaaS 架构全景</h1>
        </div>
        <div class="hero-actions">
          <div class="control-group">
            <span class="control-label">视角</span>
            <button class="view-toggle active" data-view="product" type="button">产品架构视角</button>
            <button class="view-toggle" data-view="engineering" type="button">工程映射视角</button>
          </div>
          <div class="control-group">
            <span class="control-label">状态筛选</span>
            <button class="status-filter active" data-filter="all" type="button">全部</button>
            <button class="status-filter" data-filter="implemented" type="button">已实现</button>
            <button class="status-filter" data-filter="partial" type="button">部分实现</button>
            <button class="status-filter" data-filter="planned" type="button">未实现</button>
          </div>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot dot-implemented"></span>已实现</div>
        <div class="legend-item"><span class="dot dot-partial"></span>部分实现</div>
        <div class="legend-item"><span class="dot dot-planned"></span>未实现</div>
      </div>

      <div class="topology-strip">
        <section class="topology-band">
          <div class="flow-row">
            <div class="flow-node flow-openclaw">OpenClaw 范式</div>
            <div class="flow-arrow">→</div>
            <div class="flow-node flow-liteasy">Workflow Runtime</div>
            <div class="flow-arrow">→</div>
            <div class="flow-node flow-saas">LiteasyClaw SaaS</div>
          </div>
        </section>
        <section class="stat-band">
          <div class="flow-row">
            <div class="flow-node"><span id="implemented-count">0</span> 已实现</div>
            <div class="flow-node"><span id="partial-count">0</span> 部分实现</div>
            <div class="flow-node"><span id="planned-count">0</span> 未实现</div>
          </div>
        </section>
      </div>

      <div class="page-tabs" id="page-tabs"></div>
    </header>

    <div class="workspace">
      <main class="panel">
        <h2 class="section-title" id="main-title">LiteasyClaw SaaS 架构</h2>
        <div class="map" id="map-root"></div>
      </main>

      <aside class="detail-shell">
        <section class="detail-card">
          <div class="eyebrow">节点详情</div>
          <div id="detail-root"></div>
        </section>
      </aside>
    </div>
  </div>

  <script>
    const statusMeta = {
      implemented: { label: "已实现", className: "status-implemented" },
      partial: { label: "部分实现", className: "status-partial" },
      planned: { label: "未实现", className: "status-planned" }
    };

    const detailNodes = {
      relation_openclaw: {
        id: "relation_openclaw",
        label: "LiteasyClaw 与 OpenClaw 的关系",
        status: "partial",
        category: "关系",
        summary: "OpenClaw 范式 / Workflow / Skill-Action / SaaS 产品层",
        responsibilities: [
          "把 OpenClaw 作为 workflow 思路、skill/action 边界和 runtime 范式来源",
          "把 LiteasyClaw 定位成桌面端为入口的 SaaS 产品，而不是单一桌面应用",
          "让产品层、云端层、内部后台层都围绕 agent runtime 统一收束"
        ],
        engineering: [
          "<code>liteasyclaw-openclaw-architecture.html</code>",
          "<code>docs/LiteasyClaw_功能与UI设计文档1.0.md</code>",
          "<code>docs/Saas/LiteasyClaw_SaaS纠偏设计与调整方案.md</code>",
          "<code>desktop/src/app/features/skills/</code>",
          "<code>services/dev-cloud/providers/openaiResponses.mjs</code>"
        ],
        evidence: [
          "产品文档已经明确写出“用户交互层 + agent 工作流层”",
          "仓库已存在 <code>skillRegistry.ts</code>、<code>actionRegistry.ts</code>、provider seam",
          "但正式云端 workflow runtime、skill registry、model gateway 仍未独立成型"
        ],
        gaps: [
          "还缺正式的云端 workflow runtime 作为 OpenClaw 范式的主要承载体",
          "还缺 Git 管理的 skill 包、prompt 资产层和正式 model gateway",
          "当前更多是“局部吸收 OpenClaw 思路”，不是完整 runtime 落地"
        ],
        openclaw: "底层范式 / Runtime 来源 / 不直接对外"
      },
      user_end: {
        id: "user_end",
        label: "用户端",
        status: "partial",
        category: "产品层",
        summary: "用户端是 LiteasyClaw 的客户入口层，当前以桌面端为主，负责工作区、阅读、问答、组织入口与结果承载。",
        responsibilities: [
          "工作区与文献库浏览",
          "中栏阅读和多标签产物承载",
          "右栏统一会话入口",
          "组织入口、个人中心、设置和插件入口"
        ],
        engineering: [
          "<code>desktop/</code>",
          "<code>desktop/src/app/layout/</code>",
          "<code>desktop/src/app/features/</code>"
        ],
        evidence: [
          "桌面三栏工作台已存在",
          "组织页、个人中心、设置页、AI Assistant 都已有真实组件"
        ],
        gaps: [
          "整体仍以 prototype seam 为主，很多能力还依赖 mock 数据或 demo handler",
          "插件入口和正式 workflow 驱动能力仍未正式化"
        ],
        openclaw: "入口层 / 结果承载"
      },
      desktop_workbench: {
        id: "desktop_workbench",
        label: "桌面工作台 UI",
        status: "implemented",
        category: "用户端子模块",
        summary: "三栏工作台、最左活动栏、左栏/中栏/右栏骨架和核心页面已经落地，是当前完成度最高的部分。",
        responsibilities: [
          "文献库、组织、个人中心、设置导航",
          "中栏 Reader / Artifact 承载",
          "右栏 Assistant 承载"
        ],
        engineering: [
          "<code>desktop/src/app/layout/AppShell.tsx</code>",
          "<code>desktop/src/app/layout/ActivityBar.tsx</code>",
          "<code>desktop/src/app/layout/ReaderPane.tsx</code>",
          "<code>desktop/src/app/layout/AssistantSidebar.tsx</code>"
        ],
        evidence: [
          "已有真实 React 组件和测试覆盖",
          "可通过 <code>npm run dev</code> 或 Tauri 窗口直接查看"
        ],
        gaps: [
          "视觉和状态处理仍偏 demo 语义",
          "很多业务动作未来需要改由云端 workflow 主导"
        ],
        openclaw: "产品 UI / 非 Runtime 本体"
      },
      library_workspace: {
        id: "library_workspace",
        label: "文献库与工作区",
        status: "partial",
        category: "用户端子模块",
        summary: "工作区、选中文献集、锁定、导入、收藏、推荐缓存语义已经建立，但底层资源边界仍未正式化。",
        responsibilities: [
          "展示当前工作区目录视图",
          "形成选中文献集",
          "承接导入和分析前置条件",
          "收藏与关联推荐的交互"
        ],
        engineering: [
          "<code>desktop/src/app/features/library/</code>",
          "<code>desktop/src/app/features/workspace/</code>",
          "<code>desktop/src/app/features/import/</code>",
          "<code>desktop/src/app/features/collection/</code>"
        ],
        evidence: [
          "左栏文献树、选中文献集、锁定与导入流程已存在",
          "推荐/收藏拖拽与缓存也有测试和客户端代码"
        ],
        gaps: [
          "本地文件夹、用户云私有、组织共享和缓存之间的正式资源模型还未重建",
          "对象存储、元数据、索引和版本控制还没有正式平台模块"
        ],
        openclaw: "资源前置层 / Workflow 上下文"
      },
      assistant_ui: {
        id: "assistant_ui",
        label: "右栏 AI Assistant",
        status: "partial",
        category: "用户端子模块",
        summary: "三模式入口、历史会话、新建会话、语音预留和带审计/引用展示的问答已经有原型闭环。",
        responsibilities: [
          "作为统一自然语言入口",
          "承接 explain / command / qa 三种模式",
          "呈现引用、可信度和执行痕迹"
        ],
        engineering: [
          "<code>desktop/src/app/features/assistant/AssistantPane.tsx</code>",
          "<code>desktop/src/app/features/assistant/ModeSwitch.tsx</code>",
          "<code>desktop/src/app/features/assistant/generateAssistantAnswer.ts</code>"
        ],
        evidence: [
          "问答、模式切换、历史会话、语音 seam 已有真实组件和测试",
          "当前生成和审计已经能串起前端与 dev-cloud"
        ],
        gaps: [
          "当前 prompt 组装和 workflow 仍主要在前端代码里",
          "正式的云端 skill 路由和任务编排还未接管"
        ],
        openclaw: "统一入口 / 前端版"
      },
      org_management: {
        id: "org_management",
        label: "组织入口与组织内管理",
        status: "partial",
        category: "用户端子模块",
        summary: "组织列表、组织摘要、治理摘要、共享库切换、创建/加入/邀请/退出原型已经存在，但仍是 demo 级多租户能力。",
        responsibilities: [
          "组织列表和成员/通知查看",
          "组织共享文献库打开",
          "组织内动作入口"
        ],
        engineering: [
          "<code>desktop/src/app/features/organization/</code>",
          "<code>services/dev-cloud/payloads/organizationPayloads.mjs</code>",
          "<code>services/dev-cloud/db/organizationRepository.mjs</code>"
        ],
        evidence: [
          "桌面端已有组织页与多种组织动作弹窗",
          "dev-cloud 已有组织 repository 和相关接口"
        ],
        gaps: [
          "正式多租户权限、事件流、共享库生命周期和真实存储都未完成",
          "仍然偏向 demo payload + mock action flow"
        ],
        openclaw: "组织上下文 / 非组织模型本体"
      },
      profile_center: {
        id: "profile_center",
        label: "个人中心与画像配置",
        status: "partial",
        category: "用户端子模块",
        summary: "个人中心、画像开关、学术档案和清空画像的 UI 已有，但正式画像推断和外部授权仍未实现。",
        responsibilities: [
          "展示用户基本信息",
          "编辑基础画像配置",
          "开启/关闭画像采样"
        ],
        engineering: [
          "<code>desktop/src/app/features/profile/</code>"

    const summaryNodes = Object.values(detailNodes).filter((node) => node.category !== "关系");

    let currentView = "product";
    let currentFilter = "all";
    let currentPage = "product-overview";
    let selectedNodeId = "relation_openclaw";

    const mapRoot = document.getElementById("map-root");
    const detailRoot = document.getElementById("detail-root");
    const mainTitle = document.getElementById("main-title");
    const pageTabsRoot = document.getElementById("page-tabs");

    function updateSummary() {
      const implemented = summaryNodes.filter((node) => node.status === "implemented").length;
      const partial = summaryNodes.filter((node) => node.status === "partial").length;
      const planned = summaryNodes.filter((node) => node.status === "planned").length;

      document.getElementById("implemented-count").textContent = String(implemented);
      document.getElementById("partial-count").textContent = String(partial);
      document.getElementById("planned-count").textContent = String(planned);
    }

    function getStatusBadge(status) {
      const meta = statusMeta[status];
      return `<span class="status-badge ${meta.className}">${meta.label}</span>`;
    }

    function isVisibleByFilter(status) {
      if (currentFilter === "all") {
        return true;
      }

      return status === currentFilter;
    }

    function getPagesForView() {
      return currentView === "product" ? productPages : engineeringPages;
    }

    function getCurrentPageConfig() {
      const pages = getPagesForView();
      return pages.find((page) => page.id === currentPage) ?? pages[0];
    }

    function ensureValidPage() {
      const pages = getPagesForView();
      if (!pages.some((page) => page.id === currentPage)) {
        currentPage = pages[0].id;
      }
    }

    function renderPageTabs() {
      const pages = getPagesForView();
      pageTabsRoot.innerHTML = pages
        .map((page) => `<button class="page-tab${page.id === currentPage ? " active" : ""}" data-page="${page.id}" type="button">${page.label}</button>`)
        .join("");
    }

    function getVisibleNodesFromSections(sections) {
      return sections
        .flatMap((section) => section.nodes)
        .map((id) => detailNodes[id])
        .filter((node) => isVisibleByFilter(node.status));
    }

    function ensureVisibleSelection(sections) {
      const visibleNodes = getVisibleNodesFromSections(sections);
      if (!visibleNodes.length) {
        return;
      }

      if (!visibleNodes.some((node) => node.id === selectedNodeId)) {
        selectedNodeId = visibleNodes[0].id;
      }
    }

    function renderSections(sections) {
      const html = sections
        .map((section) => {
          const visibleNodes = section.nodes
            .map((id) => detailNodes[id])
            .filter((node) => isVisibleByFilter(node.status));

          if (!visibleNodes.length) {
            return "";
          }

          const nodeCards = visibleNodes
            .map((node) => {
              const activeClass = node.id === selectedNodeId ? " active" : "";
              const metaChips = [
                `<span class="meta-chip">${node.category}</span>`,
                ...node.engineering.slice(0, 2).map((path) => `<span class="meta-chip">${path.replace(/<[^>]+>/g, "")}</span>`)
              ].join("");

              return `
                <button class="node-card${activeClass}" data-node-id="${node.id}" data-status="${node.status}" type="button">
                  ${getStatusBadge(node.status)}
                  <h4>${node.label}</h4>
                  <div class="node-meta">${metaChips}</div>
                </button>
              `;
            })
            .join("");

          return `
            <section class="lane">
              <div class="lane-head">
                <div>
                  <h3>${section.label}</h3>
                </div>
                ${getStatusBadge(section.status)}
              </div>
              <div class="node-grid">${nodeCards}</div>
            </section>
          `;
        })
        .join("");

      mapRoot.innerHTML = html || `<section class="lane"><div class="lane-head"><div><h3>没有匹配节点</h3></div></div></section>`;
    }

    function renderEngineeringChips(items) {
      return `<div class="detail-chip-row">${items.slice(0, 5).map((item) => `<span class="detail-chip">${item.replace(/<[^>]+>/g, "")}</span>`).join("")}</div>`;
    }

    function shortenText(text) {
      return text
        .replace(/<[^>]+>/g, "")
        .split(/[，。；：]/)[0]
        .trim();
    }

    function renderTagList(items) {
      return `<div class="detail-chip-row">${items.slice(0, 4).map((item) => `<span class="detail-chip">${shortenText(item)}</span>`).join("")}</div>`;
    }

    function renderDetail(nodeId) {
      const node = detailNodes[nodeId] || detailNodes.relation_openclaw;

      detailRoot.innerHTML = `
        <div class="detail-title-row">
          <div>
            <div class="eyebrow">${node.category}</div>
            <h3>${node.label}</h3>
          </div>
          ${getStatusBadge(node.status)}
        </div>
        <p class="detail-summary">${node.summary}</p>

        <div class="detail-section">
          <h4>职责</h4>
          ${renderTagList(node.responsibilities)}
        </div>

        <div class="detail-section">
          <h4>工程落点</h4>
          ${renderEngineeringChips(node.engineering)}
        </div>

        <div class="detail-section">
          <h4>证据</h4>
          ${renderTagList(node.evidence)}
        </div>

        <div class="detail-section">
          <h4>差距</h4>
          ${renderTagList(node.gaps)}
        </div>

        <div class="detail-section">
          <h4>OpenClaw</h4>
          <div class="detail-chip-row"><span class="detail-chip">${node.openclaw}</span></div>
        </div>
      `;
    }

    function render() {
      ensureValidPage();
      const page = getCurrentPageConfig();
      mainTitle.textContent = page.title;
      renderPageTabs();
      ensureVisibleSelection(page.sections);
      renderSections(page.sections);

      renderDetail(selectedNodeId);
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-node-id], .view-toggle, .status-filter, .page-tab");
      if (!target) {
        return;
      }

      if (target.classList.contains("view-toggle")) {
        currentView = target.dataset.view;
        document.querySelectorAll(".view-toggle").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === currentView);
        });
        ensureValidPage();
        render();
        return;
      }

      if (target.classList.contains("status-filter")) {
        currentFilter = target.dataset.filter;
        document.querySelectorAll(".status-filter").forEach((button) => {
          button.classList.toggle("active", button.dataset.filter === currentFilter);
        });
        render();
        return;
      }

      if (target.classList.contains("page-tab")) {
        currentPage = target.dataset.page;
        render();
        return;
      }

      selectedNodeId = target.dataset.nodeId;
      render();
    });

    updateSummary();
    render();
  </script>
