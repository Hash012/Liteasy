<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">按功能决定数据能去哪里</title><desc id="desc">本地资产可以按独立授权发送到模型、同步服务器和外部客户端；本地优先不等于所有功能离线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6cbd"/></marker></defs><rect width="1120" height="650" rx="18" fill="#f4f6fa"/><text x="40" y="57" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="700" fill="#172332">按功能决定数据能去哪里</text><text x="40" y="89" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171">原创概念示意 · 非应用截图 · 基线 0.1.28 / 2026-10-02</text><rect x="40" y="175" width="285" height="240" rx="12" fill="#eaf3fc" stroke="#dbe2ec"/><text x="60" y="210" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">本机资料与应用</text><text x="60" y="240" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">PDF、批注、笔记、白板</text><text x="60" y="264" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">已保存对话与偏好</text><text x="60" y="288" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">本地只读帮助</text><text x="60" y="312" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">每条连接独立判断权限</text><rect x="500" y="136" width="580" height="134" rx="12" fill="#ffffff" stroke="#dbe2ec"/><text x="520" y="171" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">你选择的模型／文献服务</text><text x="520" y="201" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">问题与实际上下文；题录查询</text><text x="520" y="225" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">增强推荐的敏感输入需外发授权</text><path d="M325 294 H405 V201 H490" fill="none" stroke="#0f6cbd" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="302" width="580" height="134" rx="12" fill="#ffffff" stroke="#dbe2ec"/><text x="520" y="337" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">你配置的 WebDAV</text><text x="520" y="367" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">按类别传输；外部目录与密钥另选</text><text x="520" y="391" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">关闭类别不删除已经存在的远端数据</text><path d="M325 294 H405 V367 H490" fill="none" stroke="#0f6cbd" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="468" width="580" height="134" rx="12" fill="#ffffff" stroke="#dbe2ec"/><text x="520" y="503" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">本机 MCP 客户端／评论 Review</text><text x="520" y="533" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">本机桥接不替你决定客户端模型去向</text><text x="520" y="557" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">停止共享不能撤回已接收的内容</text><path d="M325 294 H405 V533 H490" fill="none" stroke="#0f6cbd" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="465" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#0f6cbd" font-weight="650">本机文件 ≠ 永不外发</text><text x="42" y="499" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#0f6cbd" font-weight="650">同步 ≠ 独立备份</text><text x="42" y="533" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#0f6cbd" font-weight="650">取消 ≠ 撤销已完成效果</text></svg>