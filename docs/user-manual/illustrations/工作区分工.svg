<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">工作区各部分，负责不同的事</title><desc id="desc">左侧文献库定位对象，中间打开阅读编辑，AI围绕明确上下文工作；底部显示选择对象元信息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6cbd"/></marker></defs><rect width="1120" height="570" rx="18" fill="#f4f6fa"/><text x="40" y="57" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="700" fill="#172332">工作区各部分，负责不同的事</text><text x="40" y="89" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171">原创概念示意 · 非应用截图 · 基线 0.1.28 / 2026-10-02</text><rect x="40" y="128" width="245" height="280" rx="12" fill="#ffffff" stroke="#dbe2ec"/><text x="60" y="163" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">文献库</text><text x="60" y="193" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">找文件与论文</text><text x="60" y="217" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">单击选择、双击打开</text><text x="60" y="241" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">展开论文附属资源</text><text x="60" y="265" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">分类、标签与搜索</text><rect x="315" y="128" width="475" height="280" rx="12" fill="#eaf3fc" stroke="#dbe2ec"/><text x="335" y="163" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">阅读与编辑</text><text x="335" y="193" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">打开 PDF、笔记或白板</text><text x="335" y="217" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">核对原文与批注</text><text x="335" y="241" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">保存编辑，再验证内容</text><text x="335" y="265" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">关闭标签不等于删除资产</text><rect x="820" y="128" width="260" height="280" rx="12" fill="#ffffff" stroke="#dbe2ec"/><text x="840" y="163" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">AI 与助手</text><text x="840" y="193" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">选择可用模型</text><text x="840" y="217" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">引用需要的资料</text><text x="840" y="241" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">检查读取范围</text><text x="840" y="265" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">生成结果仍需核验</text><rect x="40" y="434" width="1040" height="92" rx="12" fill="#ffffff" stroke="#dbe2ec"/><text x="60" y="469" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#172332" font-weight="650">底部元信息：说明当前选中的对象</text><text x="60" y="499" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14" fill="#546171" font-weight="400">选中的条目不一定是中间正在阅读的标签；先核对身份，避免同名资料混淆。</text></svg>