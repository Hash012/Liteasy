[package]
name = "liteasy-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4.44"
keyring = "4.1.6"
openidconnect = { version = "4.0.1", features = ["timing-resistant-secret-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.5.1", features = [] }
notify = "8"
rfd = "0.15"
url = "2.5.8"
webbrowser = { version = "1.2.4", features = ["hardened"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
