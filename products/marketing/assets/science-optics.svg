<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title description">
  <title id="title">凸透镜光路示意</title>
  <desc id="description">平行于主光轴的三束光，通过凸透镜后汇聚于右侧焦点 F。光线、透镜和焦点分别标记，展示简洁科学图解的表达方式。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#c85b45" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="720" height="600" fill="#f7f8f4"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="44" y="62" fill="#2f6a58" font-size="14" letter-spacing="2">LIGHT / OPTICS</text>
    <text x="44" y="105" fill="#18201d" font-size="28">光线如何汇聚？</text>
    <path d="M 48 306 H 672" fill="none" stroke="#aebfb4" stroke-width="1.5" stroke-dasharray="6 8"/>
    <path d="M 338 166 Q 278 306 338 446 Q 398 306 338 166 Z" fill="#dfece4" stroke="#2f6a58" stroke-width="2"/>
    <g fill="none" stroke="#c85b45" stroke-width="2.5">
      <path d="M 66 221 H 240" marker-end="url(#arrow)"/><path d="M 240 221 H 338 L 538 306 L 648 353"/>
      <path d="M 66 306 H 240" marker-end="url(#arrow)"/><path d="M 240 306 H 648"/>
      <path d="M 66 391 H 240" marker-end="url(#arrow)"/><path d="M 240 391 H 338 L 538 306 L 648 259"/>
    </g>
    <circle cx="538" cy="306" r="14" fill="#f7f8f4"/>
    <circle cx="538" cy="306" r="5" fill="#c85b45"/>
    <path d="M 545 296 L 570 268" fill="none" stroke="#65716c"/>
    <text x="568" y="254" fill="#18201d" font-size="18">焦点 F</text>
    <text x="70" y="184" fill="#65716c" font-size="17">平行光</text>
    <text x="338" y="482" text-anchor="middle" fill="#2f6a58" font-size="17">凸透镜</text>
    <path d="M 44 520 H 676" stroke="#d4dbd5"/>
    <text x="44" y="557" fill="#65716c" font-size="15">平行入射 → 透镜折射 → 焦点汇聚</text>
    <text x="44" y="582" fill="#65716c" font-size="12">薄透镜模型 · 科学图解示意</text>
  </g>
</svg>
