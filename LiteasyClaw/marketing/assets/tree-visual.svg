  <rect width="720" height="420" fill="#fffdf8"/>
  <path d="M360 210C290 210 265 120 180 94M360 210C430 210 455 120 540 94M360 210C290 210 265 300 180 326M360 210C430 210 455 300 540 326" fill="none" stroke="#9eb0a7" stroke-width="2"/>
