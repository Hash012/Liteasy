name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_staging:
        description: "Publish the unsigned installer to staging"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: products/liteasy/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report workflow start
        continue-on-error: true
        shell: pwsh
        run: Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=started"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/liteasy/apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: products/liteasy/apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        id: dependencies
        run: npm ci

      - name: Report dependency installation
        continue-on-error: true
        shell: pwsh
        run: Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=dependencies"

      - name: Test desktop frontend
        id: frontend_tests
        shell: pwsh
        run: |
          npm test -- --testTimeout=120000 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\frontend-tests.log"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $diagnostic = Get-Content "$env:RUNNER_TEMP\frontend-tests.log" |
              Where-Object { $_ -match "FAIL|Failed Tests|Test Files|Tests|Error: Test timed|Unable to find" } |
              Select-Object -Last 60
            $summary = ($diagnostic -join "`n")
            if ($summary.Length -gt 3500) {
              $summary = $summary.Substring($summary.Length - 3500)
            }
            $query = [uri]::EscapeDataString($summary)
            Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=frontend_failure&ci_result=$query"
            exit $exitCode
          }

      - name: Report frontend tests
        continue-on-error: true
        shell: pwsh
        run: Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=frontend_tests"

      - name: Build and verify production assets
        id: frontend_build
        env:
          VITE_FORUM_API_URL: https://community.staging.liteasyclaw.com
          VITE_FORUM_WEB_URL: https://community.staging.liteasyclaw.com
          VITE_LITEASY_CLOUD_URL: https://api.staging.liteasyclaw.com
        run: npm run build

      - name: Report production asset build
        continue-on-error: true
        shell: pwsh
        run: Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=frontend_build"

      - name: Check Tauri host
        id: tauri_check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Report Tauri host check
        continue-on-error: true
        shell: pwsh
        run: Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=tauri_check"

      - name: Build NSIS installer
        id: installer_build
        env:
          VITE_FORUM_API_URL: https://community.staging.liteasyclaw.com
          VITE_FORUM_WEB_URL: https://community.staging.liteasyclaw.com
          VITE_LITEASY_CLOUD_URL: https://api.staging.liteasyclaw.com
        run: npm run tauri -- build --bundles nsis

      - name: Report installer build
        continue-on-error: true
        shell: pwsh
        run: Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=installer_build"

      - name: Verify and stage unsigned installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .\src-tauri\target\release\bundle\nsis\*-setup.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Staging unsigned release expected NotSigned, received $($signature.Status)."
          }
          $version = (Get-Content .\package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Desktop package version is invalid: $version"
          }
          $filename = "Liteasy_${version}_x64-setup.exe"
          $published = Join-Path $env:RUNNER_TEMP $filename
          Copy-Item $installers[0].FullName $published
          $hash = (Get-FileHash -Algorithm SHA256 $published).Hash.ToLowerInvariant()
          "filename=$filename" >> $env:GITHUB_OUTPUT
          "path=$published" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$((Get-Item $published).Length)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Liteasy-windows-x64-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Request staging upload identity
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_staging) || startsWith(github.ref, 'refs/tags/v')
        id: oidc
        shell: pwsh
        run: |
          $audience = [uri]::EscapeDataString("liteasy-staging-installer-upload")
          $response = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience"
          Write-Output "::add-mask::$($response.value)"
          "token=$($response.value)" >> $env:GITHUB_OUTPUT

      - name: Publish unsigned installer to staging
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_staging) || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.sha256 }}
          RELEASE_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:RELEASE_TOKEN"
            "X-Liteasy-Release-Filename" = "${{ steps.installer.outputs.filename }}"
            "X-Liteasy-Release-Sha" = "$env:GITHUB_SHA"
            "X-Liteasy-Release-Sha256" = "$env:INSTALLER_SHA256"
            "X-Liteasy-Release-Version" = "${{ steps.installer.outputs.version }}"
          }
          Invoke-RestMethod `
            -ContentType "application/octet-stream" `
            -Headers $headers `
            -InFile $env:INSTALLER_PATH `
            -Method Put `
            -Uri "https://staging.liteasyclaw.com/api/releases/windows-installer"

      - name: Verify staging publication
        id: staging_verification
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_staging) || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -TimeoutSec 30 -Uri "https://staging.liteasyclaw.com/healthz/waitlist"
          if (-not $health.ok -or -not $health.installerReady) {
            throw "Staging installer did not become ready."
          }

      - name: Report workflow outcome
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $query = [uri]::EscapeDataString((ConvertTo-Json -Compress @{
            dependencies = "${{ steps.dependencies.outcome }}"
            frontendBuild = "${{ steps.frontend_build.outcome }}"
            frontendTests = "${{ steps.frontend_tests.outcome }}"
            installerBuild = "${{ steps.installer_build.outcome }}"
            stagingVerification = "${{ steps.staging_verification.outcome }}"
            tag = "$env:GITHUB_REF_NAME"
            tauriCheck = "${{ steps.tauri_check.outcome }}"
          }))
          Invoke-RestMethod -TimeoutSec 15 -Uri "https://staging.liteasyclaw.com/healthz/waitlist?ci_stage=outcome&ci_result=$query"
