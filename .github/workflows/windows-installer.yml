name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-desktop:
    uses: ./.github/workflows/desktop-frontend.yml
    with:
      full-tests: true
  build-windows:
    needs: test-desktop
    uses: ./.github/workflows/desktop-windows.yml
    with:
      build-installer: true
